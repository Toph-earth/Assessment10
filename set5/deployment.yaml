apiVersion: apps/v1
kind: Deployment
metadata:
  name: disaster-relief
spec:
  replicas: 3
  selector:
    matchLabels:
      app: disaster-relief
  template:
    metadata:
      labels:
        app: disaster-relief
    spec:
      containers:
      - name: disaster-relief
      image: bramag/disaster-relief:latest
      ports:
      - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: disaster-relief-service
spec:
  type: NodePort
  selector:
    app: disaster-relief
  ports:
    port: 80
    targetPort: 80
    nodePort: 30027
      
